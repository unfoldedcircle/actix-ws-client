[package]
name = "actix-ws-client"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
authors = ["Markus Zehnder <markus.z@unfoldedcircle.com>"]
license = "MIT OR Apache-2.0"
description = "Actor-based WebSocket client for Actix with automatic reconnection and ping/pong keep-alive"
repository = "https://github.com/unfoldedcircle/actix-ws-client"
readme = "README.md"
keywords = ["websocket", "actix", "client", "reconnect"]
categories = ["network-programming", "web-programming::websocket", "asynchronous"]

[package.metadata.docs.rs]
# Document the API of both TLS backends.
all-features = true

[features]
default = ["native-tls"]
# TLS with the platform's native library (OpenSSL on Linux, Secure Transport on macOS,
# SChannel on Windows).
native-tls = ["dep:native-tls", "tokio-tungstenite/native-tls"]
# TLS with rustls; server certificates are verified with `rustls-platform-verifier`
# (the platform's trust store). The application must install a rustls `CryptoProvider`.
rustls-platform-verifier = [
    "dep:rustls",
    "dep:rustls-platform-verifier",
    # A private feature of tokio-tungstenite: its only way to get rustls without a
    # bundled root store. Check it when updating tokio-tungstenite.
    "tokio-tungstenite/__rustls-tls",
]

[dependencies]
actix = "0.13"
tokio = { version = "1.42", features = ["macros", "net", "sync", "time"] }
tokio-tungstenite = "0.30"
native-tls = { version = "0.2", optional = true }
# tls12: servers that do not speak TLS 1.3 yet, as with the native-tls backend.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"], optional = true }
rustls-platform-verifier = { version = "0.7", optional = true }
futures = "0.3"
bytes = "1"
log = "0.4"
derive_builder = "0.20"
fastrand = "2"

[dev-dependencies]
actix-rt = "2.10"
env_logger = "0.11"
tokio = { version = "1.42", features = ["macros", "rt", "sync", "time", "test-util", "net", "io-util"] }
# TLS end-to-end tests: self-signed certificate and a local `wss://` server.
rcgen = "0.14"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# tls12: the native TLS library of macOS does not support TLS 1.3.
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
# Used by the tests of a ready-made native-tls connector.
native-tls = "0.2"
