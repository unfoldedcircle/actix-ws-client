name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a branch replaces its running checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Same toolchain as the main consumer (remote-core).
  TOOLCHAIN_VERSION: "1.89.0"
  # `rust-version` of Cargo.toml.
  MSRV_VERSION: "1.88.0"

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$TOOLCHAIN_VERSION" --profile minimal --component rustfmt
          rustup default "$TOOLCHAIN_VERSION"

      - name: Check formatting
        run: cargo fmt --all -- --check

  test:
    name: clippy, test (${{ matrix.name }})
    runs-on: ${{ matrix.os || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: native-tls
            flags: ""
          - name: rustls-platform-verifier
            flags: "--no-default-features --features rustls-platform-verifier"
          - name: both TLS backends
            flags: "--features rustls-platform-verifier"
          - name: no TLS
            flags: "--no-default-features"
          # native-tls is another TLS library on every platform: Secure Transport here.
          - name: native-tls, macOS
            flags: ""
            os: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$TOOLCHAIN_VERSION" --profile minimal --component clippy
          rustup default "$TOOLCHAIN_VERSION"

      - name: Run clippy
        run: cargo clippy --all-targets ${{ matrix.flags }} -- -D warnings

      - name: Run tests
        run: cargo test ${{ matrix.flags }}

  checks:
    name: msrv, docs, android
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchains
        run: |
          rustup toolchain install "$MSRV_VERSION" --profile minimal
          rustup toolchain install "$TOOLCHAIN_VERSION" --profile minimal --target aarch64-linux-android
          rustup default "$TOOLCHAIN_VERSION"

      # The library only: dev-dependencies may need a newer compiler.
      - name: Build with the minimum supported Rust version
        run: |
          cargo +"$MSRV_VERSION" check --lib
          cargo +"$MSRV_VERSION" check --lib --no-default-features --features rustls-platform-verifier
          cargo +"$MSRV_VERSION" check --lib --no-default-features

      - name: Build the documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: |
          cargo doc --no-deps --all-features
          cargo doc --no-deps --no-default-features

      # A build check only: the platform verifier has its own code for Android.
      - name: Build for Android
        run: cargo check --lib --no-default-features --features rustls-platform-verifier --target aarch64-linux-android
