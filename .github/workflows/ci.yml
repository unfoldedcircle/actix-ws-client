name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Same toolchain as the main consumer (remote-core).
  TOOLCHAIN_VERSION: "1.89.0"

jobs:
  test:
    name: fmt, clippy, test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$TOOLCHAIN_VERSION" --profile minimal --component rustfmt,clippy
          rustup default "$TOOLCHAIN_VERSION"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy -- -D warnings

      - name: Run tests
        run: cargo test
